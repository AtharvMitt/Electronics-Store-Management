.428" style="stroke:#181818;stroke-width:0.5;"/><text x="736.5" y="354.463" fill="#000" font-size="15" textLength="138.031">productId: ObjectId</text><text x="736.5" y="374.893" fill="#000" font-size="15" textLength="122.686">sku, name: String</text><text x="736.5" y="395.324" fill="#000" font-size="15" textLength="118.561">quantity: Integer</text><text x="736.5" y="415.754" fill="#000" font-size="15" textLength="275.192">unitPriceMinor, lineTotalMinor: Integer</text></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="68"><path d="M297,756.568 L297,827.858 A0,0 0 0 0 297,827.858 L674.657,827.858 A0,0 0 0 0 674.657,827.858 L674.657,766.568 L664.657,756.568 L490,756.568 L486,666.238 L482,756.568 L297,756.568 A0,0 0 0 0 297,756.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M664.657,756.568 L664.657,766.568 L674.657,766.568 L664.657,756.568" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="303" y="777.603" fill="#000" font-size="15" textLength="280.067">Each productId references one Product.</text><text x="303" y="798.033" fill="#000" font-size="15" textLength="323.192">This also applies to ReceiptItem and SaleItem.</text><text x="303" y="818.463" fill="#000" font-size="15" textLength="356.657">Each product may occur only once per items array.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="73"><path d="M877,736.068 L877,848.219 A0,0 0 0 0 877,848.219 L1270.857,848.219 A0,0 0 0 0 1270.857,848.219 L1270.857,746.068 L1260.857,736.068 L1000.263,736.068 L912.237,676.24 L992.263,736.068 L877,736.068 A0,0 0 0 0 877,736.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1260.857,736.068 L1260.857,746.068 L1270.857,746.068 L1260.857,736.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="883" y="757.103" fill="#000" font-size="15" textLength="304.232">createdBy / receivedBy reference one User;</text><text x="883" y="777.533" fill="#000" font-size="15" textLength="372.857">a User may create many purchases, receipts or sales.</text><text x="883" y="797.963" fill="#000" font-size="15" textLength="365.747">Each receipt references 1..100 InventoryTransaction</text><text x="883" y="818.393" fill="#000" font-size="15" textLength="319.412">events, one matching event per received line.</text><text x="883" y="838.824" fill="#000" font-size="15" textLength="371.013">Event sourceId is the Purchase ID, not the receipt ID.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="association"><path d="M486,193.36 C486,212.087 486,232.71 486,252.738" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="488" y="229.103" fill="#000" font-size="15" textLength="71.61">supplierId</text><text x="461" y="247.774" fill="#000" font-size="15" textLength="24.885">0..*</text><text x="477" y="210.395" fill="#000" font-size="15">1</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="composition"><polygon points="352.145,455.25,344.945,455.643,342.538,462.44,349.739,462.047,352.145,455.25" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M342.538,462.44 C300.92,493.588 266.484,519.362 231.692,545.401" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="328" y="491.103" fill="#000" font-size="15" textLength="123.391">supplierSnapshot</text><text x="222.692" y="540.436" fill="#000" font-size="15">1</text><text x="343.145" y="472.285" fill="#000" font-size="15">1</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-link-type="composition"><polygon points="486,455.25,482,461.25,486,467.25,490,461.25,486,455.25" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M486,467.25 C486,490.707 486,503.194 486,524.978" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="4